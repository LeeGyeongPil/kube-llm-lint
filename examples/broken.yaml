# Intentionally misconfigured manifests for three serving engines.
# Run: kube-llm-lint examples/broken.yaml
# The token below is a made-up example value, not a real credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-70b
spec:
  replicas: 1
  selector:
    matchLabels: {app: llama-70b}
  template:
    metadata:
      labels: {app: llama-70b}
    spec:
      volumes:
      - name: hf-cache
        emptyDir: {}
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args:
        - --model=meta-llama/Llama-3.3-70B-Instruct
        - --tensor-parallel-size
        - "4"
        - --gpu-memory-utilization=1.2
        env:
        - name: HF_TOKEN
          value: hf_exampleexampleexample
        resources:
          limits:
            nvidia.com/gpu: 2
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
---
apiVersion: v1
kind: Pod
metadata:
  name: sglang
spec:
  volumes:
  - name: model-cache
    persistentVolumeClaim:
      claimName: sglang-cache
  containers:
  - name: sglang
    image: lmsysorg/sglang:latest
    command: ["python3", "-m", "sglang.launch_server"]
    args: ["--model-path", "Qwen/Qwen2.5-7B-Instruct", "--tp", "2"]
    env:
    - name: HF_HOME
      value: /models
    resources:
      limits:
        nvidia.com/gpu: "2"
    volumeMounts:
    - name: model-cache
      mountPath: /models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgi
spec:
  selector:
    matchLabels: {app: tgi}
  template:
    metadata:
      labels: {app: tgi}
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tgi-data
      containers:
      - name: tgi
        image: ghcr.io/huggingface/text-generation-inference:3.3.5
        env:
        - name: MODEL_ID
          value: mistralai/Mistral-7B-Instruct-v0.3
        - name: NUM_SHARD
          value: "2"
        resources:
          limits:
            nvidia.com/gpu: 2
        volumeMounts:
        - name: data
          mountPath: /data
