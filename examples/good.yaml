# The same three servers as broken.yaml, fixed.
# Run: kube-llm-lint examples/good.yaml   (no findings, exit code 0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-70b
spec:
  replicas: 1
  selector:
    matchLabels: {app: llama-70b}
  template:
    metadata:
      labels: {app: llama-70b}
    spec:
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hf-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args:
        - --model=meta-llama/Llama-3.3-70B-Instruct
        - --tensor-parallel-size
        - "4"
        - --gpu-memory-utilization=0.9
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: hf-token-secret, key: token}
        resources:
          limits:
            nvidia.com/gpu: 4
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
        startupProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
---
apiVersion: v1
kind: Pod
metadata:
  name: sglang
spec:
  volumes:
  - name: model-cache
    persistentVolumeClaim:
      claimName: sglang-cache
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 2Gi
  containers:
  - name: sglang
    image: lmsysorg/sglang:latest
    command: ["python3", "-m", "sglang.launch_server"]
    args: ["--model-path", "Qwen/Qwen2.5-7B-Instruct", "--tp", "2"]
    env:
    - name: HF_HOME
      value: /models
    resources:
      limits:
        nvidia.com/gpu: "2"
    volumeMounts:
    - name: model-cache
      mountPath: /models
    - name: shm
      mountPath: /dev/shm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgi
spec:
  selector:
    matchLabels: {app: tgi}
  template:
    metadata:
      labels: {app: tgi}
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tgi-data
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      containers:
      - name: tgi
        image: ghcr.io/huggingface/text-generation-inference:3.3.5
        env:
        - name: MODEL_ID
          value: mistralai/Mistral-7B-Instruct-v0.3
        - name: NUM_SHARD
          value: "2"
        resources:
          limits:
            nvidia.com/gpu: 2
        volumeMounts:
        - name: data
          mountPath: /data
        - name: shm
          mountPath: /dev/shm
