# Shape of `kubectl kustomize` output for examples/broken.yaml: keys sorted, namespace llm added.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-70b
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-70b
  template:
    metadata:
      labels:
        app: llama-70b
    spec:
      containers:
      - args:
        - --model=meta-llama/Llama-3.3-70B-Instruct
        - --tensor-parallel-size
        - '4'
        - --gpu-memory-utilization=1.2
        env:
        - name: HF_TOKEN
          value: hf_exampleexampleexample
        image: vllm/vllm-openai:v0.11.0
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        name: vllm
        resources:
          limits:
            nvidia.com/gpu: 2
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: hf-cache
      volumes:
      - emptyDir: {}
        name: hf-cache
---
apiVersion: v1
kind: Pod
metadata:
  name: sglang
  namespace: llm
spec:
  containers:
  - args:
    - --model-path
    - Qwen/Qwen2.5-7B-Instruct
    - --tp
    - '2'
    command:
    - python3
    - -m
    - sglang.launch_server
    env:
    - name: HF_HOME
      value: /models
    image: lmsysorg/sglang:latest
    name: sglang
    resources:
      limits:
        nvidia.com/gpu: '2'
    volumeMounts:
    - mountPath: /models
      name: model-cache
  volumes:
  - name: model-cache
    persistentVolumeClaim:
      claimName: sglang-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgi
  namespace: llm
spec:
  selector:
    matchLabels:
      app: tgi
  template:
    metadata:
      labels:
        app: tgi
    spec:
      containers:
      - env:
        - name: MODEL_ID
          value: mistralai/Mistral-7B-Instruct-v0.3
        - name: NUM_SHARD
          value: '2'
        image: ghcr.io/huggingface/text-generation-inference:3.3.5
        name: tgi
        resources:
          limits:
            nvidia.com/gpu: 2
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tgi-data
