[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kube-llm-lint"
version = "0.1.1"
description = "Offline linter that cross-checks vLLM, SGLang and TGI server arguments against the Kubernetes pod spec (GPU count, /dev/shm, probe budget, HF cache, token)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["kubernetes", "vllm", "sglang", "tgi", "llm", "lint", "gpu", "helm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]
dependencies = ["ruamel.yaml==0.19.1"]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/kube-llm-lint"
Issues = "https://github.com/LeeGyeongPil/kube-llm-lint/issues"
Changelog = "https://github.com/LeeGyeongPil/kube-llm-lint/blob/main/CHANGELOG.md"

[project.scripts]
kube-llm-lint = "kube_llm_lint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/kube_llm_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
